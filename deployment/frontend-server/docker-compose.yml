version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "80:80"
    volumes:
      - ./app:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - VITE_API_URL=http://backend-server:8000/api
    command: >
      sh -c "npm install && npm run build && 
             npm install -g http-server && 
             http-server dist -p 80"
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge
